<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图个乐 · 生成测试台</title>
  <style>
    :root {
      --ink: #151524;
      --ink-soft: #25243a;
      --paper: #f7f3ee;
      --muted: #777589;
      --line: rgba(21, 21, 36, .13);
      --coral: #ff6b5c;
      --lime: #c6f36b;
      --violet: #8f7aff;
      --white: #fffdfa;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input, select { font: inherit; }
    button, input, select { outline-color: var(--violet); }
    .shell { max-width: 1480px; margin: 0 auto; padding: 24px clamp(18px, 4vw, 62px) 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.03em; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--ink); color: var(--lime); border-radius: 9px 9px 9px 2px; font-size: 18px; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
    .mode { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13px; }
    .mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 4px rgba(255, 107, 92, .16); }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 28px; padding: 56px 0 34px; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(36px, 6vw, 76px); line-height: .95; letter-spacing: -.065em; }
    .intro p { max-width: 290px; margin: 0 0 4px; color: var(--muted); line-height: 1.6; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(260px, 300px) minmax(360px, 1fr) minmax(220px, 280px); gap: 16px; align-items: stretch; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 18px; }
    .controls, .runlog { padding: 22px; }
    .panel-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
    .panel-title h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .panel-title span { color: var(--muted); font-size: 11px; }
    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .field input[type="text"], .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--paper); color: var(--ink); }
    .filebox { position: relative; display: grid; gap: 7px; padding: 18px 14px; border: 1px dashed rgba(21, 21, 36, .3); border-radius: 12px; background: #fbfaf8; cursor: pointer; }
    .filebox strong { font-size: 13px; }
    .filebox span { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .filebox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .primary { width: 100%; border: 0; border-radius: 11px; padding: 13px 16px; background: var(--ink); color: var(--lime); font-weight: 800; cursor: pointer; transition: transform .18s ease, background .18s ease; }
    .primary:hover { transform: translateY(-2px); background: var(--ink-soft); }
    .primary:disabled { opacity: .55; cursor: wait; transform: none; }
    .hint { margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .stage { position: relative; min-height: 570px; overflow: hidden; background: var(--ink); border-radius: 18px; color: var(--white); }
    .stage::before { content: ""; position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(to bottom, black, transparent 82%); }
    .stage-head { position: relative; z-index: 1; display: flex; justify-content: space-between; padding: 22px; color: rgba(255,255,255,.68); font-size: 12px; }
    .stage-head strong { color: var(--white); font-size: 13px; }
    .stage-empty { position: absolute; inset: 92px 28px 28px; display: grid; place-items: center; text-align: center; }
    .empty-inner { max-width: 260px; }
    .empty-shape { width: 96px; height: 96px; margin: 0 auto 22px; border: 1px solid rgba(198,243,107,.7); border-radius: 50% 42% 58% 45%; transform: rotate(-17deg); }
    .empty-inner h3 { margin: 0 0 9px; font-size: 21px; letter-spacing: -.04em; }
    .empty-inner p { margin: 0; color: rgba(255,255,255,.54); font-size: 13px; line-height: 1.6; }
    .result-image { position: absolute; z-index: 1; inset: 72px 24px 24px; width: calc(100% - 48px); height: calc(100% - 96px); object-fit: contain; border-radius: 12px; background: #090912; }
    .stage-badge { position: absolute; z-index: 2; left: 36px; bottom: 36px; padding: 8px 10px; border-radius: 99px; background: var(--lime); color: var(--ink); font-size: 11px; font-weight: 800; }
    .runlog { display: flex; min-height: 570px; flex-direction: column; }
    .steps { display: grid; gap: 12px; margin-bottom: 30px; }
    .step { display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: start; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .step-dot { width: 13px; height: 13px; margin-top: 1px; border: 2px solid rgba(21,21,36,.2); border-radius: 50%; }
    .step.active { color: var(--ink); }
    .step.active .step-dot { border-color: var(--coral); background: var(--coral); box-shadow: 0 0 0 4px rgba(255,107,92,.14); }
    .step.done .step-dot { border-color: #5cae56; background: #5cae56; }
    .meta { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
    .meta-row { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid rgba(21,21,36,.08); font-size: 12px; }
    .meta-row span:first-child { color: var(--muted); }
    .meta-row span:last-child { max-width: 145px; overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .error { margin-top: 14px; padding: 11px 12px; border-radius: 10px; background: #fff0ee; color: #a33d34; font-size: 12px; line-height: 1.45; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .primary { transition: none; } .primary:hover { transform: none; } }
    @media (max-width: 1060px) { .layout { grid-template-columns: minmax(240px, 280px) minmax(360px, 1fr); } .runlog { grid-column: 1 / -1; min-height: 0; } .steps { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; } .meta { margin-top: 22px; } }
    @media (max-width: 700px) { .shell { padding-top: 15px; } .topbar { align-items: flex-start; } .mode { font-size: 11px; } .intro { display: block; padding: 38px 0 24px; } .intro p { margin-top: 18px; } .layout { display: block; } .stage { min-height: 500px; margin: 16px 0; } .controls, .runlog { padding: 18px; } .steps { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark">乐</span><span>图个乐<small>生成测试工作台</small></span></div>
      <div class="mode"><i></i><span>本地服务 · 商汤模式</span></div>
    </header>
    <section class="intro">
      <h1>把一张照片，<br><em>变成一张图。</em></h1>
      <p>这里用来验收真实生成链路。选模板、上传图片，等结果落到右侧舞台。</p>
    </section>
    <main class="layout">
      <section class="panel controls">
        <div class="panel-title"><h2>开始一次生成</h2><span>01 / 03</span></div>
        <form id="generate-form">
          <div class="field"><label for="owner">测试用户</label><input id="owner" type="text" value="demo-owner" autocomplete="off"></div>
          <div class="field"><label for="template">选择模板</label><select id="template" required><option value="">正在读取模板…</option></select></div>
          <div class="field"><label for="file">上传一张图片</label><label class="filebox" for="file"><strong id="file-name">选择 JPG、PNG 或 WebP</strong><span>单张不超过 10MB；当前商汤模式为文生图，图片用于验证上传与数据隔离</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label></div>
          <button class="primary" id="submit" type="submit">开始生成</button>
          <p class="hint">成功后会显示模型、任务状态、输出尺寸和下载预览。</p>
          <div class="error" id="error" hidden></div>
        </form>
      </section>
      <section class="stage" aria-live="polite">
        <div class="stage-head"><strong>结果舞台</strong><span id="stage-status">等待输入</span></div>
        <div class="stage-empty" id="empty-state"><div class="empty-inner"><div class="empty-shape"></div><h3>舞台还空着</h3><p>生成完成后，结果会在这里出现。</p></div></div>
        <img class="result-image" id="result-image" alt="生成结果预览" hidden>
        <span class="stage-badge" id="stage-badge" hidden>已生成</span>
      </section>
      <aside class="panel runlog">
        <div class="panel-title"><h2>运行状态</h2><span id="elapsed">—</span></div>
        <div class="steps">
          <div class="step" id="step-template"><span class="step-dot"></span><span>读取模板</span></div>
          <div class="step" id="step-upload"><span class="step-dot"></span><span>上传图片并校验</span></div>
          <div class="step" id="step-generate"><span class="step-dot"></span><span>调用生成模型</span></div>
        </div>
        <div class="meta">
          <div class="meta-row"><span>模型</span><span id="meta-provider">—</span></div>
          <div class="meta-row"><span>任务</span><span id="meta-task">—</span></div>
          <div class="meta-row"><span>状态</span><span id="meta-status">等待操作</span></div>
          <div class="meta-row"><span>尺寸</span><span id="meta-size">—</span></div>
        </div>
      </aside>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const owner = $("owner");
    const template = $("template");
    const file = $("file");
    const form = $("generate-form");
    const submit = $("submit");
    const error = $("error");
    let resultUrl = null;
    let startedAt = 0;

    function setStep(id, state) {
      const node = $(id);
      node.classList.toggle("active", state === "active");
      node.classList.toggle("done", state === "done");
    }
    function resetSteps() { ["step-template", "step-upload", "step-generate"].forEach((id) => setStep(id, "")); }
    function showError(message) { error.textContent = message; error.hidden = !message; }
    async function readJson(response) {
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload?.error?.message || `请求失败（${response.status}）`);
      return payload;
    }
    async function loadTemplates() {
      try {
        const payload = await readJson(await fetch("/api/v1/templates"));
        template.innerHTML = payload.items.map((item) => `<option value="${item.template_id}" data-width="${item.target_width}" data-height="${item.target_height}">${item.name} · ${item.kind}</option>`).join("");
        setStep("step-template", "done");
      } catch (err) { template.innerHTML = "<option value=''>模板读取失败</option>"; showError(err.message); }
    }
    file.addEventListener("change", () => { $("file-name").textContent = file.files[0]?.name || "选择 JPG、PNG 或 WebP"; });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const selected = file.files[0];
      if (!selected || !template.value) { showError("请选择模板和图片后再生成。"); return; }
      if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
      startedAt = performance.now(); submit.disabled = true; submit.textContent = "生成中…"; resetSteps();
      $("stage-status").textContent = "正在处理"; $("meta-status").textContent = "上传中"; $("result-image").hidden = true; $("stage-badge").hidden = true; $("empty-state").hidden = false;
      try {
        setStep("step-template", "done"); setStep("step-upload", "active");
        const headers = { "X-Owner-ID": owner.value.trim() || "demo-owner" };
        const body = new FormData(); body.append("file", selected);
        const upload = await readJson(await fetch("/api/v1/uploads", { method: "POST", headers, body }));
        setStep("step-upload", "done"); setStep("step-generate", "active"); $("meta-status").textContent = "生成中";
        const task = await readJson(await fetch("/api/v1/tasks", { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify({ template_id: template.value, upload_id: upload.upload_id }) }));
        setStep("step-generate", "done");
        const version = task.versions[task.versions.length - 1];
        const asset = await fetch(version.asset_url, { headers });
        if (!asset.ok) throw new Error("生成成功，但结果下载失败。");
        resultUrl = URL.createObjectURL(await asset.blob()); $("result-image").src = resultUrl; $("result-image").hidden = false; $("empty-state").hidden = true; $("stage-badge").hidden = false;
        $("stage-status").textContent = "已完成"; $("meta-provider").textContent = task.provider; $("meta-task").textContent = task.task_id.slice(0, 8); $("meta-status").textContent = task.status; const option = template.options[template.selectedIndex]; $("meta-size").textContent = `${option.dataset.width} × ${option.dataset.height}`; $("elapsed").textContent = `${Math.round(performance.now() - startedAt)} ms`;
      } catch (err) { resetSteps(); $("stage-status").textContent = "需要处理"; $("meta-status").textContent = "失败"; showError(err.message); }
      finally { submit.disabled = false; submit.textContent = "开始生成"; }
    });
    loadTemplates();
  </script>
</body>
</html>
